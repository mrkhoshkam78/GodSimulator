<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>GOD SIMULATOR — THE WORLD IS YOURS</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@500;700;900&family=Vazirmatn:wght@300;400;500;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="css/style.css" />
</head>
<body>
  <div id="starfield"></div>
  <canvas id="particles"></canvas>

  <div id="intro" class="intro">
    <div class="intro-glow"></div>
    <h1 class="intro-title">GOD SIMULATOR</h1>
    <p class="intro-sub">THE WORLD IS YOURS</p>
    <p class="intro-line">در آغاز، فقط سکوت بود… سپس تو سخن گفتی.</p>
    <button id="btn-begin" class="btn-divine">خالق جهان شو</button>
  </div>

  <div id="app" class="app hidden">
    <header class="topbar">
      <div class="brand">
        <span class="brand-mark">◈</span>
        <div>
          <strong>GOD SIMULATOR</strong>
          <small>THE WORLD IS YOURS</small>
        </div>
      </div>
      <div class="world-stats" id="world-stats"></div>
      <div class="time-controls">
        <button data-speed="0" title="توقف">❚❚</button>
        <button data-speed="1" class="active" title="عادی">▶</button>
        <button data-speed="3" title="سریع">▶▶</button>
        <button data-speed="8" title="بسیار سریع">▶▶▶</button>
        <span id="time-display">روز ۱ — سال ۱</span>
      </div>
    </header>

    <aside class="sidebar">
      <nav>
        <button class="nav-btn active" data-view="world">جهان</button>
        <button class="nav-btn" data-view="prayers">اتاق دعاها <span id="prayer-badge" class="badge">0</span></button>
        <button class="nav-btn" data-view="powers">قدرت‌های الهی</button>
        <button class="nav-btn" data-view="events">تاریخچه جهان</button>
        <button class="nav-btn" data-view="missions">مأموریت‌ها</button>
      </nav>
      <div class="sidebar-actions">
        <button id="btn-save">ذخیره</button>
        <button id="btn-load">بارگذاری</button>
        <button id="btn-new">جهان نو</button>
        <label class="audio-toggle"><input type="checkbox" id="chk-audio" /> صدا</label>
      </div>
    </aside>

    <main class="main">
      <section id="view-world" class="view">
        <div class="toolbar">
          <input id="search" type="search" placeholder="جست‌وجوی نام…" />
          <select id="filter-life"><option value="all">همه وضعیت‌ها</option><option value="alive">زنده</option><option value="dead">فوت‌شده</option></select>
          <select id="filter-emotion"><option value="all">همه احساسات</option></select>
          <select id="filter-job"><option value="all">همه مشاغل</option></select>
          <select id="sort-by">
            <option value="name">مرتب‌سازی: نام</option>
            <option value="age">سن</option>
            <option value="faith">ایمان</option>
            <option value="wealth">ثروت</option>
          </select>
          <button id="btn-select-mode">انتخاب گروهی</button>
        </div>
        <div id="people-grid" class="people-grid"></div>
      </section>

      <section id="view-prayers" class="view hidden">
        <h2 class="view-title">اتاق دعاها</h2>
        <div id="prayer-chamber" class="prayer-chamber"></div>
      </section>

      <section id="view-powers" class="view hidden">
        <h2 class="view-title">سی گانه قدرت الهی</h2>
        <div id="powers-menu" class="powers-menu"></div>
      </section>

      <section id="view-events" class="view hidden">
        <h2 class="view-title">تاریخ جهان</h2>
        <div class="toolbar">
          <select id="event-filter"><option value="all">همه رویدادها</option></select>
        </div>
        <div id="event-log" class="event-log"></div>
      </section>

      <section id="view-missions" class="view hidden">
        <h2 class="view-title">مأموریت‌های اختیاری</h2>
        <div id="missions" class="missions"></div>
      </section>
    </main>
  </div>

  <div id="modal" class="modal hidden">
    <div class="modal-panel" id="modal-panel"></div>
  </div>

  <div id="toast-stack" class="toast-stack"></div>
  <div id="fx-overlay" class="fx-overlay"></div>

  <script src="js/data.js"></script>
  <script src="js/utils.js"></script>
  <script src="js/save.js"></script>
  <script src="js/simulation.js"></script>
  <script src="js/powers.js"></script>
  <script src="js/ui.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
