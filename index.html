<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Castle Defense - دفاع از قلعه</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <div id="gameContainer">
        <canvas id="gameCanvas" width="1280" height="720"></canvas>
    </div>
    <div id="loading">در حال بارگذاری بازی...</div>

    <!-- Data -->
    <script src="js/data/TroopsData.js"></script>
    <script src="js/data/EnemiesData.js"></script>
    <script src="js/data/WeaponsData.js"></script>

    <script src="js/core/ParticleSystem.js"></script>
    <script src="js/core/Input.js"></script>
    <script src="js/systems/WaveSystem.js"></script>

    <script src="js/art/AssetManager.js"></script>
    <script src="js/art/TroopVisual.js"></script>
    <script src="js/art/SpriteAnimator.js"></script>
    <script src="js/art/SwordsmanRenderer.js"></script>

    <script src="js/entities/Castle.js"></script>
    <script src="js/entities/Troop.js"></script>
    <script src="js/entities/Enemy.js"></script>
    <script src="js/entities/Weapon.js"></script>

    <script src="js/core/Game.js"></script>
    <script src="js/main.js"></script>

    <script>
        window.addEventListener('load', () => {
            document.getElementById('loading').style.display = 'none';
